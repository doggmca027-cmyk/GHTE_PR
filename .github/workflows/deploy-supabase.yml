name: Deploy Supabase (migrations + Edge Functions)

# Frontend deploys are handled by the Vercel <-> GitHub integration.
# This workflow ships the backend whenever supabase/ changes on main (or when run by hand).
# Function SECRETS are not touched here: they live only in Supabase (see DEPLOYMENT.md).

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase
  cancel-in-progress: false # never interrupt a running migration

jobs:
  deploy:
    name: Push migrations and deploy functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Create an "production" environment in GitHub (Settings -> Environments) and add required
    # reviewers if you want a manual approval before every backend deploy.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Refuse to deploy a backend that fails its own audit.
      - name: Supabase audit
        run: npm run check:supabase
      - name: Tests
        run: npm test

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply migrations
        run: supabase db push --yes

      - name: Deploy Edge Functions
        run: supabase functions deploy
