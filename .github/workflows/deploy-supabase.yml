name: Deploy Supabase (migrations + Edge Functions)

# Frontend deploys are handled by the Vercel <-> GitHub integration.
# This workflow ships the backend whenever supabase/ changes on main (or when run by hand).
# Function SECRETS are not touched here: they live only in Supabase (see DEPLOYMENT.md).
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions; repository level or the
# "production" environment): SUPABASE_ACCESS_TOKEN (account token, starts with sbp_) and SUPABASE_DB_PASSWORD.
# The project ref is not a secret; it defaults to this project and can be overridden with a repository
# VARIABLE named SUPABASE_PROJECT_ID. Without the two secrets the deploy is skipped with a warning (not a red failure).
# Applying migrations is a no-op when none are pending, and deploying functions is idempotent, so re-running is always safe.

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase
  cancel-in-progress: false # never interrupt a running migration

jobs:
  deploy:
    name: Push migrations and deploy functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Create an "production" environment in GitHub (Settings -> Environments) and add required
    # reviewers if you want a manual approval before every backend deploy.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || 'btvbedplxsqkxlzgygvh' }}
    steps:
      # Values are never printed; only what is wrong with them (missing / wrong shape).
      - name: Check deploy secrets
        id: secrets
        run: |
          missing=""
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning title=Supabase deploy skipped::Missing GitHub secrets:$missing. Add them in Settings > Secrets and variables > Actions to enable automatic backend deploys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bad=0
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) ;;
            *) echo "::error title=SUPABASE_ACCESS_TOKEN looks wrong::It must be an account access token starting with sbp_ (Supabase dashboard > Account > Access Tokens). Its length is ${#SUPABASE_ACCESS_TOKEN}."; bad=1 ;;
          esac
          if ! printf '%s' "$SUPABASE_PROJECT_ID" | grep -Eq '^[a-z0-9]{20}$'; then
            echo "::error title=SUPABASE_PROJECT_ID looks wrong::The project ref is 20 lowercase letters/digits (its length here is ${#SUPABASE_PROJECT_ID})."; bad=1
          fi
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'

      # Refuse to deploy a backend that fails its own audit (every migration on a fresh database, RLS, grants, function exposure).
      # The test suite is NOT repeated here: CI runs it on the same commit in parallel (three shards), and `npm run check` passes locally
      # before every push. Running it twice made every deploy wait five minutes for nothing.
      - name: Supabase audit
        if: steps.secrets.outputs.ready == 'true'
        run: npm run check:supabase

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: latest

      # The CLI's error is copied into an annotation (secrets masked) so a failure explains itself on the run page.
      - name: Link project
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set +e
          out=$(supabase link --project-ref "$SUPABASE_PROJECT_ID" 2>&1); code=$?
          out=${out//"$SUPABASE_ACCESS_TOKEN"/***}
          out=${out//"$SUPABASE_DB_PASSWORD"/***}
          echo "$out"
          if [ "$code" -ne 0 ]; then
            echo "::error title=supabase link failed::$(printf '%s' "$out" | tail -4 | tr '\n' ' ' | cut -c1-450)"
            exit "$code"
          fi

      - name: Apply migrations
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set +e
          out=$(supabase db push --yes 2>&1); code=$?
          out=${out//"$SUPABASE_ACCESS_TOKEN"/***}
          out=${out//"$SUPABASE_DB_PASSWORD"/***}
          echo "$out"
          if [ "$code" -ne 0 ]; then
            echo "::error title=supabase db push failed::$(printf '%s' "$out" | tail -4 | tr '\n' ' ' | cut -c1-450)"
            exit "$code"
          fi

      - name: Deploy Edge Functions
        if: steps.secrets.outputs.ready == 'true'
        run: supabase functions deploy
