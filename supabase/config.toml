project_id = "smm-mini-app"

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# Called before the client has a JWT; the function authenticates via signed initData.
[functions.telegram-auth]
verify_jwt = false

# Not callable by clients: authenticates itself with CRON_SECRET or the service role key.
[functions.sync-catalog]
verify_jwt = false

# Authenticates itself by verifying the telegram-auth JWT (HS256, JWT_SECRET).
[functions.place-order]
verify_jwt = false

# Both authenticate by verifying the telegram-auth JWT (HS256, JWT_SECRET).
[functions.create-deposit]
verify_jwt = false

[functions.verify-deposit]
verify_jwt = false

# Scheduler-only: authenticates itself with CRON_SECRET or the service role key.
[functions.sync-order-status]
verify_jwt = false

# Admin-only: authenticates itself by verifying the telegram-auth JWT (HS256, JWT_SECRET) + users.is_admin.
[functions.admin-pricing]
verify_jwt = false

# Scheduler-only: authenticates itself with CRON_SECRET or the service role key.
[functions.provider-health-monitor]
verify_jwt = false

# Admin-only: authenticates itself by verifying the telegram-auth JWT (HS256, JWT_SECRET) + users.is_admin.
[functions.admin-treasury]
verify_jwt = false

# Admin-only: authenticates itself by verifying the telegram-auth JWT (HS256, JWT_SECRET) + users.is_admin.
[functions.admin-analytics]
verify_jwt = false

# Admin-only: authenticates itself by verifying the telegram-auth JWT (HS256, JWT_SECRET) + users.is_admin.
[functions.admin-settings]
verify_jwt = false

# Admin-only: authenticates itself by verifying the telegram-auth JWT (HS256, JWT_SECRET) + users.is_admin.
[functions.admin-reconciliation]
verify_jwt = false

# Admin-only: authenticates itself by verifying the telegram-auth JWT (HS256, JWT_SECRET) + users.is_admin.
[functions.admin-observability]
verify_jwt = false

# Admin-only: authenticates itself by verifying the telegram-auth JWT (HS256, JWT_SECRET) + users.is_admin.
[functions.admin-catalog-mapping]
verify_jwt = false

# Admin-only: authenticates itself by verifying the telegram-auth JWT (HS256, JWT_SECRET) + users.is_admin.
[functions.admin-providers]
verify_jwt = false

# Signed-in users: authenticates itself by verifying the telegram-auth JWT (HS256, JWT_SECRET); the caller is always the JWT user.
[functions.referrals]
verify_jwt = false

# Signed-in users: authenticates itself by verifying the telegram-auth JWT (HS256, JWT_SECRET); the caller is always the JWT user.
[functions.quote-order]
verify_jwt = false

# Ad networks call this with a signed postback; it authenticates by verifying the signature itself, never by JWT.
[functions.ad-webhook]
verify_jwt = false

# Signed-in users: authenticates itself by verifying the telegram-auth JWT (HS256, JWT_SECRET); the caller is always the JWT user.
[functions.track-event]
verify_jwt = false

# Scheduler-only: authenticates with the cron secret or the service role key, never a user JWT.
[functions.telegram-notifier]
verify_jwt = false
